<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Cat - 宇宙猫ジェネレーター</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <meta name="description" content="動物写真の背景を宇宙に変換!ブラウザで完結、画像はサーバーに送信されません。">

  <!-- OGP -->
  <meta property="og:title" content="Space Cat - 宇宙猫ジェネレーター" />
  <meta property="og:description" content="動物写真をアップロードするだけ！背景を自動で除去して宇宙猫画像を作れるツール。すべてブラウザ内で完結、サーバー送信なし。 #SpaceCat" />
  <meta property="og:image" content="https://raw.githubusercontent.com/kikurage-en/space-cat/main/public/ogp.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:url" content="https://kikurage-en.github.io/space-cat/" />
  <meta property="og:type" content="website" />

  <!-- X (Twitter) Card -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Space Cat - 宇宙猫ジェネレーター" />
  <meta property="twitter:description" content="動物写真から宇宙猫をつくろう🪐 すべてローカル処理で安心 #SpaceCat" />
  <meta property="twitter:image:src" content="https://raw.githubusercontent.com/kikurage-en/space-cat/main/public/ogp.jpg" />
  <meta property="twitter:image:alt" content="宇宙を背景に猫が浮かぶ合成画像" />

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="title-emoji">🪐</span> <span class="title-text">Space Cat</span></h1>
      <p class="subtitle">動物写真を宇宙に送ろう</p>
    </header>

    <!-- アップロードセクション -->
    <section id="upload-section">
      <div id="upload-area" class="upload-area">
        <div class="upload-icon">📷</div>
        <p class="upload-text">写真をドラッグ&ドロップ<br>またはタップして選択</p>
        <p class="upload-hint">画像はサーバーに送信されません</p>
      </div>
      <input type="file" id="file-input" accept="image/*" hidden>
    </section>

    <!-- 処理中セクション -->
    <section id="processing-section" class="hidden">
      <div class="processing-content">
        <div class="spinner"></div>
        <p id="processing-status" class="processing-status">背景を除去中...</p>
      </div>
    </section>

    <!-- 結果セクション -->
    <section id="result-section" class="hidden">
      <!-- 画角セレクター -->
      <!-- ボタンは src/main.ts の RATIOS から生成 -->
      <div class="ratio-selector" id="ratio-selector"></div>

      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="result-canvas" width="1080" height="1080"></canvas>
        <div id="drag-guide" class="drag-guide hidden">
          <span>ドラッグで移動</span>
        </div>
      </div>

      <!-- 背景セレクター -->
      <!-- サムネイルは src/main.ts の BACKGROUNDS から生成 -->
      <div class="bg-selector" id="bg-selector"></div>
      <p class="bg-credit" id="bg-credit"></p>

      <!-- コントロール -->
      <div class="controls">
        <div class="control-row">
          <label class="control-label">サイズ</label>
          <input type="range" id="scale-slider" class="slider" min="0.05" max="3" step="0.05" value="0.7">
        </div>
        <div class="control-row">
          <label class="control-label">回転</label>
          <input type="range" id="rotation-slider" class="slider" min="-180" max="180" step="1" value="0">
        </div>
        <div class="control-row control-row-buttons">
          <button id="flip-btn" class="btn-icon">↔ 反転</button>
          <button id="reset-btn" class="btn-icon">🔄 リセット</button>
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="actions">
        <button id="save-btn" class="btn btn-primary">💾 保存</button>
        <button id="share-btn" class="btn btn-share">📤 シェア</button>
        <button id="tweet-btn" class="btn btn-tweet">𝕏 ポスト</button>
      </div>
      <div class="actions-sub">
        <span id="hashtag" class="hashtag">#SpaceCat</span>
      </div>
    </section>

    <footer>
      <p class="privacy-note">画像はすべてブラウザ内で処理されます。サーバーには送信されません。</p>
      <p class="bg-source">背景画像: NASA / ESA / JPL-Caltech / STScI</p>
      <div class="sample-section">
        <span class="sample-label">SAMPLE</span>
        <img class="sample-image" src="sample-result.webp" alt="生成サンプル: 星雲を背景に浮かぶ猫" width="800" height="800" loading="lazy" decoding="async">
      </div>
      <p class="license-note">
        AGPL-3.0-only · <a href="https://github.com/kikurage-en/space-cat" target="_blank" rel="noopener noreferrer" class="credit-link">Source Code</a>
      </p>
    </footer>
  </div>

  <!-- トースト -->
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
